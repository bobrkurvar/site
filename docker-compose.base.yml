services:
  app:
    image: bobrkurva111/app
    build:
      context: .
      dockerfile: ./Dockerfile
      target: main_app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      API_HOST: image_service
      REDIS_HOST: redis
    networks:
      internal: {}
    depends_on:
      postgres:
        condition: service_started
      image_service:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./static/images:/pysite/static/images
    restart: unless-stopped

  image_service:
    image: bobrkurva111/image_service
    build:
      context: .
      dockerfile: ./Dockerfile
      target: image
    env_file:
      - .env
    environment:
      PORT: ${IMAGE_PORT}
    networks:
      internal: {}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      internal: {}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/backup_final.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U postgres -d ${DB_NAME}"
        ]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrate:
    image: bobrkurva111/migrate
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
    volumes:
      - ./migrations/versions:/pysite/migrations/versions
    networks:
      internal: {}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  runner:
    image: bobrkurva111/runner
    build:
      context: .
      dockerfile: ./Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
    networks:
      internal: {}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  generate_miniatures:
    image: bobrkurva111/generate_miniatures
    profiles: ["tools"]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: generate_miniatures
    env_file:
      - .env
    volumes:
      - ./static/images:/pysite/static/images
    restart: "no"

  rename_collections:
    image: bobrkurva111/rename_collections
    profiles: ["tools"]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: rename_collections
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
    volumes:
      - ./static/images/base/collections:/pysite/static/images/base/collections
    networks:
      internal: {}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./static:/var/www/static:ro
    networks:
      internal: {}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      internal: {}

networks:
  internal:
    driver: bridge

volumes:
  pgdata: