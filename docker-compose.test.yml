services:
  e2e_tests:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: e2e_tests
    env_file:
      - .env
    environment:
      API_HOST: nginx
    depends_on:
      app:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      runner:
        condition: service_completed_successfully
      redis:
        condition: service_started

  int_tests:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: int_tests
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: main_app
    env_file:
      - .env
    environment:
      IS_TEST: True
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${TEST_DB_NAME}
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      API_HOST: image_service
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${TEST_DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${TEST_DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${TEST_DB_NAME}
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  runner:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${TEST_DB_NAME}
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    container_name: site_nginx
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./static:/var/www/static:ro

  redis:
    image: redis:7-alpine