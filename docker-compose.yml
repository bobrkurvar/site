services:
  app:
    image: mysite/app
    build:
      context: .
      dockerfile: ./Dockerfile
      target: main_app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      API_HOST: image_service
      REDIS_HOST: redis
    networks:
      - internal
    depends_on:
      - image_service
      - redis
      - postgres
    volumes:
      - ./static/images:/pysite/static/images # bind mount docker compose down -v не удалит этот том
    restart: unless-stopped

  image_service:
    image: mysite/image_service
    build:
      context: .
      dockerfile: ./Dockerfile
      target: image
    env_file:
      - .env
    environment:
      PORT: ${IMAGE_PORT}
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - internal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init/backup.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro # при пустой базе выполнит всё что в этой папке
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    image: mysite/migrate
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
    networks:
      - internal
    depends_on:
      - postgres
    restart: "no"

  runner:
    profiles: ["tools"]
    image: mysite/runner
    build:
      context: .
      dockerfile: ./Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
    networks:
      - internal
    depends_on:
      - postgres
    restart: "no"

  resize-images-script:
    profiles: [ "tools" ]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: resize-images-script
    env_file:
      - .env
    volumes:
      - ./static/images:/pysite/static/images # bind mount docker compose down -v не удалит этот том
    restart: "no"

  migrate-collection-paths:
    profiles: [ "tools" ]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrate_paths_script
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
    networks:
      - internal
    depends_on:
      - postgres
    volumes:
      - ./static/images:/pysite/static/images
    restart: "no"

  fix-extensions-script:
    profiles: [ "tools" ]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: fix-extensions-script
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - internal
    volumes:
      - ./static/images:/pysite/static/images
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./static:/var/www/static:ro
    restart: unless-stopped

    networks:
      - internal
      - traefik-public

    labels:
      - traefik.enable=true

      # домен проекта
      - traefik.http.routers.project1.rule=Host(`keramovibor.ru`) || Host(`www.keramovibor.ru`)
      - traefik.http.routers.project1.entrypoints=websecure
      - traefik.http.routers.project1.tls.certresolver=le

      # какой внутренний порт слушает nginx в контейнере
      - traefik.http.services.project1.loadbalancer.server.port=80

      # в какой docker-сети traefik должен найти контейнер
      - traefik.docker.network=traefik-public

  redis:
    image: redis:7-alpine
    networks:
      - internal

networks:
  internal:
    driver: bridge

  traefik-public:
    external: true

volumes:
  pgdata: